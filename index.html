<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />

  <title>PFW Reply</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    h1 {
      text-align: center;
      margin: 0 0 20px;
      font-size: 28px;
    }

    .topic-box {
      margin-bottom: 24px;
    }

    .topic-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }

    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      min-height: 360px;
    }

    .account {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 18px;
    }

    .message-wrapper {
      position: relative;
      background: #f8f8f8;
      border-radius: 14px;
      padding: 42px 16px 18px;
      min-height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 16px;
    }

    .message {
      width: 100%;
      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 17px;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;

      border: none;
      background: transparent;
      color: #666;

      padding: 6px 8px;
      border-radius: 8px;

      font-size: 13px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #eaeaea;
    }

    .copy-btn:disabled {
      cursor: default;
    }

    .random-btn,
    .reply-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .random-btn {
      background: #111;
      color: white;
    }

    .random-btn:hover {
      opacity: 0.9;
    }

    .random-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .reply-btn {
      background: #1d9bf0;
      color: white;
    }

    .reply-btn:hover {
      opacity: 0.9;
    }

    .reply-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .remaining {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 14px;
    }

    .tweet-id {
      text-align: center;
      color: #aaa;
      font-size: 11px;
      margin-top: auto;
      padding-top: 14px;
    }

    .status {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 20px 0;
    }

    .error {
      color: #d93025;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 12px 40px;
      }

      h1 {
        font-size: 24px;
      }

      #cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>PFW Reply</h1>

  <div class="topic-box">
    <label for="topicSelect">Topic</label>
    <select id="topicSelect">
      <option value="">กำลังโหลด...</option>
    </select>
  </div>

  <div id="status" class="status"></div>

  <div id="cards"></div>

</div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const MAIN_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CnwPK2fSRjsBrmWn3XVIXZEbDFPGguJQeco7B4nNv-7YOcxmIk0ge1846CC5OB8o3sqWK7TwIo_a/pub?output=csv";

const SPREADSHEET_ID =
  "1RJ7OzLLgvMSKdVTxVfKOqQXir7vXIIyWpa_gImp1PzM";

const SUPABASE_URL =
  "https://romrjbyaqckrpvobbzkw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4DN0Penjs0vuTYzVdY4-Ug_AmsxurCE";


/* =========================================================
   STATE
========================================================= */

let mainRows = [];
let selectedTopic = "";

const childSheetCache = new Map();
const usedMessageCache = new Map();


/* =========================================================
   DOM
========================================================= */

const topicSelect = document.getElementById("topicSelect");
const cardsContainer = document.getElementById("cards");
const statusEl = document.getElementById("status");


/* =========================================================
   HELPERS
========================================================= */

function normalizeText(text) {
  return String(text ?? "")
    .replace(/<br\s*\/?>/gi, "\n")
    .trim();
}


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function maskTweetId(tweetId) {
  const id = String(tweetId);

  if (id.length <= 4) {
    return `TW: ••••••••${id}`;
  }

  return "TW: ••••••••" + id.slice(-4);
}


function createReplyUrl(tweetId, text) {
  return (
    "https://x.com/intent/tweet" +
    "?in_reply_to=" +
    encodeURIComponent(tweetId) +
    "&text=" +
    encodeURIComponent(text)
  );
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCsv(text) {
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"') {
      if (insideQuotes && next === '"') {
        value += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }

      continue;
    }

    if (char === "," && !insideQuotes) {
      row.push(value);
      value = "";
      continue;
    }

    if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(value);
      value = "";

      if (row.some(cell => String(cell).trim() !== "")) {
        rows.push(row);
      }

      row = [];
      continue;
    }

    value += char;
  }

  if (value !== "" || row.length > 0) {
    row.push(value);

    if (row.some(cell => String(cell).trim() !== "")) {
      rows.push(row);
    }
  }

  return rows;
}


/* =========================================================
   LOAD MAIN SHEET
========================================================= */

async function loadMainSheet() {

  statusEl.textContent = "กำลังโหลดข้อมูล...";

  const response = await fetch(
    MAIN_CSV_URL + "&t=" + Date.now()
  );

  if (!response.ok) {
    throw new Error(
      `โหลด main sheet ไม่สำเร็จ: HTTP ${response.status}`
    );
  }

  const csvText = await response.text();
  const rows = parseCsv(csvText);

  if (!rows.length) {
    throw new Error("main sheet ไม่มีข้อมูล");
  }

  const headers = rows[0].map(
    h => String(h).trim().toLowerCase()
  );

  const topicIndex = headers.indexOf("topic");
  const accNameIndex = headers.indexOf("acc_name");
  const linkPostIndex = headers.indexOf("link_post");
  const tweetIdIndex = headers.indexOf("tweet_id");

  if (topicIndex === -1) {
    throw new Error("main ไม่มี column: Topic");
  }

  if (accNameIndex === -1) {
    throw new Error("main ไม่มี column: acc_name");
  }

  if (tweetIdIndex === -1) {
    throw new Error("main ไม่มี column: tweet_id");
  }

  mainRows = rows
    .slice(1)
    .map(row => ({
      topic: String(row[topicIndex] ?? "").trim(),
      acc_name: String(row[accNameIndex] ?? "").trim(),
      link_post: String(row[linkPostIndex] ?? "").trim(),
      tweet_id: String(row[tweetIdIndex] ?? "").trim()
    }))
    .filter(row => row.topic && row.tweet_id);

  statusEl.textContent = "";

  populateTopics();
}


/* =========================================================
   TOPIC
========================================================= */

function populateTopics() {

  const topics = [
    ...new Set(
      mainRows
        .map(row => row.topic)
        .filter(Boolean)
    )
  ];

  topicSelect.innerHTML =
    `<option value="">เลือก Topic</option>` +
    topics
      .map(topic =>
        `<option value="${escapeHtml(topic)}">
          ${escapeHtml(topic)}
        </option>`
      )
      .join("");
}


topicSelect.addEventListener("change", async () => {

  selectedTopic = topicSelect.value;

  childSheetCache.clear();
  usedMessageCache.clear();

  if (!selectedTopic) {
    cardsContainer.innerHTML = "";
    return;
  }

  await renderTweetCards();
});


/* =========================================================
   GET UNIQUE TWEETS
========================================================= */

function getUniqueTweets(topic) {

  const map = new Map();

  for (const row of mainRows) {

    if (row.topic !== topic) {
      continue;
    }

    const tweetId = row.tweet_id;

    if (!map.has(tweetId)) {
      map.set(tweetId, {
        tweet_id: tweetId,
        acc_name: row.acc_name,
        link_post: row.link_post
      });
    }
  }

  return [...map.values()];
}


/* =========================================================
   RENDER CARDS
========================================================= */

async function renderTweetCards() {

  cardsContainer.innerHTML = "";

  const tweets = getUniqueTweets(selectedTopic);

  if (!tweets.length) {
    cardsContainer.innerHTML =
      `<div class="empty">ไม่พบ Tweet ใน Topic นี้</div>`;
    return;
  }

  for (const tweet of tweets) {

    const card = createTweetCard(tweet);

    cardsContainer.appendChild(card);

    loadCardData(card, tweet);
  }
}


/* =========================================================
   CREATE CARD
========================================================= */

function createTweetCard(tweet) {

  const card = document.createElement("div");

  card.className = "card";

  card.dataset.tweetId = tweet.tweet_id;

  card.innerHTML = `
    <div class="account">
      @${escapeHtml(tweet.acc_name)}
    </div>

    <div class="message-wrapper">

      <button
        class="copy-btn"
        type="button"
        disabled
      >
        📋 Copy
      </button>

      <div class="message">
        กำลังโหลด...
      </div>

    </div>

    <button
      class="random-btn"
      type="button"
    >
      🎲 สุ่มข้อความ
    </button>

    <button
      class="reply-btn"
      type="button"
      disabled
    >
      Reply
    </button>

    <div class="remaining">
      message ที่เหลือ -
    </div>

    <div class="tweet-id">
      ${escapeHtml(maskTweetId(tweet.tweet_id))}
    </div>
  `;

  const randomBtn =
    card.querySelector(".random-btn");

  const replyBtn =
    card.querySelector(".reply-btn");

  const copyBtn =
    card.querySelector(".copy-btn");

  randomBtn.addEventListener(
    "click",
    () => randomAndClaim(card, tweet)
  );

  replyBtn.addEventListener(
    "click",
    () => replyTweet(card, tweet)
  );

  copyBtn.addEventListener(
    "click",
    () => copyCurrentMessage(card)
  );

  return card;
}


/* =========================================================
   LOAD CARD DATA
========================================================= */

async function loadCardData(card, tweet) {

  const messageEl =
    card.querySelector(".message");

  try {

    const messages =
      await loadChildSheet(tweet.tweet_id);

    const usedIds =
      await getUsedMessageIds(tweet.tweet_id);

    updateRemaining(
      card,
      messages.length,
      messages.length - usedIds.size
    );

    if (!messages.length) {
      messageEl.textContent =
        "ไม่มีข้อความ";
    }

  } catch (error) {

    console.error(error);

    messageEl.textContent =
      "โหลดข้อความไม่สำเร็จ";

    messageEl.classList.add("error");
  }
}


/* =========================================================
   LOAD CHILD SHEET
========================================================= */

async function loadChildSheet(tweetId) {

  const key = String(tweetId);

  if (childSheetCache.has(key)) {
    return childSheetCache.get(key);
  }

  const url =
    `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}` +
    `/gviz/tq?tqx=out:csv` +
    `&sheet=${encodeURIComponent(tweetId)}` +
    `&t=${Date.now()}`;

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(
      `โหลด sheet ${tweetId} ไม่สำเร็จ`
    );
  }

  const csvText = await response.text();

  const rows = parseCsv(csvText);

  if (!rows.length) {
    throw new Error(
      `Sheet ${tweetId} ไม่มีข้อมูล`
    );
  }


  /* ---------------------------------------------
     หา All_message
  --------------------------------------------- */

  let totalFromSheet = null;

  for (const row of rows) {

    const firstCell =
      String(row[0] ?? "").trim();

    if (
      firstCell.toLowerCase() ===
      "all_message"
    ) {

      const value =
        String(row[1] ?? "").trim();

      const parsed =
        Number(value);

      if (!Number.isNaN(parsed)) {
        totalFromSheet = parsed;
      }

      break;
    }
  }


  /* ---------------------------------------------
     หา Header
  --------------------------------------------- */

  let headerIndex = -1;

  let messageIdIndex = -1;
  let tweetIdIndex = -1;
  let textIndex = -1;
  let statusIndex = -1;

  for (let i = 0; i < rows.length; i++) {

    const headers =
      rows[i].map(
        h => String(h).trim().toLowerCase()
      );

    const mi =
      headers.indexOf("message_id");

    const ti =
      headers.indexOf("tweet_id");

    const tx =
      headers.indexOf("text");

    if (
      mi !== -1 &&
      ti !== -1 &&
      tx !== -1
    ) {

      headerIndex = i;

      messageIdIndex = mi;
      tweetIdIndex = ti;
      textIndex = tx;
      statusIndex =
        headers.indexOf("status");

      break;
    }
  }

  if (headerIndex === -1) {
    throw new Error(
      `ไม่พบ header message_id / tweet_id / text ใน sheet ${tweetId}`
    );
  }


  /* ---------------------------------------------
     Parse messages
  --------------------------------------------- */

  const messages = [];

  for (
    let i = headerIndex + 1;
    i < rows.length;
    i++
  ) {

    const row = rows[i];

    const messageId =
      String(
        row[messageIdIndex] ?? ""
      ).trim();

    const rowTweetId =
      String(
        row[tweetIdIndex] ?? ""
      ).trim();

    const text =
      normalizeText(
        row[textIndex] ?? ""
      );

    if (!messageId || !text) {
      continue;
    }

    if (
      rowTweetId &&
      rowTweetId !== key
    ) {
      continue;
    }

    messages.push({
      message_id: messageId,
      tweet_id: rowTweetId || key,
      text
    });
  }


  /*
     B1 = จำนวนทั้งหมดใน Sheet

     แต่ source ที่ใช้สุ่มจริง ๆ
     ให้ใช้ rows ที่ parse ได้
  */

  messages.totalFromSheet =
    totalFromSheet ?? messages.length;

  childSheetCache.set(key, messages);

  return messages;
}


/* =========================================================
   SUPABASE - GET USED MESSAGE IDS
========================================================= */

async function getUsedMessageIds(tweetId) {

  const key = String(tweetId);

  if (usedMessageCache.has(key)) {
    return usedMessageCache.get(key);
  }

  const url =
    `${SUPABASE_URL}/rest/v1/used_messages` +
    `?select=message_id` +
    `&tweet_id=eq.${encodeURIComponent(key)}`;

  const response = await fetch(url, {
    method: "GET",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization":
        `Bearer ${SUPABASE_KEY}`
    }
  });

  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(
      `Supabase load used messages error: ${errorText}`
    );
  }

  const data =
    await response.json();

  const usedIds =
    new Set(
      data.map(row =>
        String(row.message_id)
      )
    );

  usedMessageCache.set(
    key,
    usedIds
  );

  return usedIds;
}


/* =========================================================
   SUPABASE - CLAIM MESSAGE
========================================================= */

async function claimMessage(
  tweetId,
  messageId
) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/rpc/claim_message`,
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          `Bearer ${SUPABASE_KEY}`,
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        p_tweet_id:
          String(tweetId),

        p_message_id:
          String(messageId)
      })
    }
  );

  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(
      `Supabase claim error: ${errorText}`
    );
  }

  return await response.json();
}


/* =========================================================
   RANDOM + CLAIM
========================================================= */

async function randomAndClaim(
  card,
  tweet
) {

  const randomBtn =
    card.querySelector(".random-btn");

  const replyBtn =
    card.querySelector(".reply-btn");

  const copyBtn =
    card.querySelector(".copy-btn");

  const messageEl =
    card.querySelector(".message");

  randomBtn.disabled = true;
  replyBtn.disabled = true;
  copyBtn.disabled = true;

  messageEl.classList.remove("error");

  try {

    const messages =
      await loadChildSheet(
        tweet.tweet_id
      );


    /*
       ต้องดึง used ใหม่ทุกครั้ง

       เพราะระหว่างที่หน้าเว็บเปิดอยู่
       user คนอื่นอาจ claim message เพิ่ม
    */

    const usedIds =
      await getFreshUsedMessageIds(
        tweet.tweet_id
      );


    let available =
      messages.filter(
        message =>
          !usedIds.has(
            String(message.message_id)
          )
      );


    /*
       ถ้าไม่มี message เหลือ
    */

    if (!available.length) {

      messageEl.textContent =
        "ข้อความหมดแล้ว";

      updateRemaining(
        card,
        messages.length,
        0
      );

      return;
    }


    /*
       สุ่ม + claim

       ถ้าโดนคนอื่น claim ก่อน
       จะตัดตัวนั้นออกแล้วสุ่มใหม่
    */

    let claimedMessage = null;

    while (available.length > 0) {

      const randomIndex =
        Math.floor(
          Math.random() * available.length
        );

      const candidate =
        available[randomIndex];

      const claimed =
        await claimMessage(
          tweet.tweet_id,
          candidate.message_id
        );


      if (claimed === true) {

        claimedMessage = candidate;

        break;
      }


      /*
         มีคน claim ไปก่อนแล้ว
         เอา candidate ออกจาก pool
         แล้วสุ่มใหม่
      */

      available.splice(
        randomIndex,
        1
      );
    }


    /*
       ไม่มีตัวไหน claim ได้
    */

    if (!claimedMessage) {

      usedMessageCache.delete(
        String(tweet.tweet_id)
      );

      messageEl.textContent =
        "มีคนใช้งานพร้อมกัน ลองสุ่มใหม่อีกครั้ง";

      return;
    }


    /*
       เก็บ current message
       ไว้บน card เท่านั้น
    */

    card.currentMessage =
      claimedMessage.text;


    card.currentMessageId =
      claimedMessage.message_id;


    messageEl.textContent =
      claimedMessage.text;


    /*
       Update local cache
    */

    const cacheKey =
      String(tweet.tweet_id);

    const cachedUsed =
      usedMessageCache.get(cacheKey);

    if (cachedUsed) {

      cachedUsed.add(
        String(
          claimedMessage.message_id
        )
      );
    }


    const remaining =
      available.length - 1;


    updateRemaining(
      card,
      messages.length,
      remaining
    );


    replyBtn.disabled = false;
    copyBtn.disabled = false;

  } catch (error) {

    console.error(error);

    messageEl.textContent =
      error.message || "เกิดข้อผิดพลาด";

    messageEl.classList.add("error");

  } finally {

    randomBtn.disabled = false;
  }
}


/* =========================================================
   FRESH USED IDS
========================================================= */

async function getFreshUsedMessageIds(tweetId) {

  /*
     สำคัญ:
     ไม่ใช้ cache ตอนกดสุ่ม

     เพราะ user คนอื่นอาจเพิ่ง claim
  */

  const key = String(tweetId);

  const url =
    `${SUPABASE_URL}/rest/v1/used_messages` +
    `?select=message_id` +
    `&tweet_id=eq.${encodeURIComponent(key)}`;

  const response = await fetch(url, {
    method: "GET",

    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization":
        `Bearer ${SUPABASE_KEY}`
    }
  });

  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(
      `Supabase load used messages error: ${errorText}`
    );
  }

  const data =
    await response.json();

  const usedIds =
    new Set(
      data.map(row =>
        String(row.message_id)
      )
    );


  /*
     Update cache ด้วย
  */

  usedMessageCache.set(
    key,
    usedIds
  );

  return usedIds;
}


/* =========================================================
   COPY
========================================================= */

async function copyCurrentMessage(card) {

  const text =
    card.currentMessage;

  if (!text) {
    return;
  }

  const copyBtn =
    card.querySelector(".copy-btn");

  try {

    await navigator.clipboard.writeText(
      text
    );

    copyBtn.textContent =
      "✓ Copied";

    setTimeout(() => {

      copyBtn.textContent =
        "📋 Copy";

    }, 1200);

  } catch (error) {

    console.error(error);

    /*
       fallback สำหรับบาง browser
    */

    const textarea =
      document.createElement("textarea");

    textarea.value = text;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    copyBtn.textContent =
      "✓ Copied";

    setTimeout(() => {

      copyBtn.textContent =
        "📋 Copy";

    }, 1200);
  }
}


/* =========================================================
   REPLY
========================================================= */

function replyTweet(card, tweet) {

  const text =
    card.currentMessage;

  if (!text) {
    return;
  }

  const replyUrl =
    createReplyUrl(
      tweet.tweet_id,
      text
    );


  /*
     เปิด X Web Intent

     ถ้ามี X app
     มือถือสามารถส่งต่อไป X ได้
  */

  window.open(
    replyUrl,
    "_blank"
  );
}


/* =========================================================
   REMAINING
========================================================= */

function updateRemaining(
  card,
  total,
  remaining
) {

  const remainingEl =
    card.querySelector(".remaining");

  remainingEl.textContent =
    `message ที่เหลือ ${remaining}/${total}`;
}


/* =========================================================
   START
========================================================= */

(async function init() {

  try {

    await loadMainSheet();

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      error.message ||
      "โหลดข้อมูลไม่สำเร็จ";

    statusEl.classList.add("error");
  }

})();
</script>
