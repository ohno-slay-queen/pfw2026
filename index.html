<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GomGom Message</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f1e8;
      color: #3f3933;
    }

    .container {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    header {
      margin-bottom: 22px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8b8178;
      font-size: 14px;
    }

    .platform-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .platform-tab {
      border: 1px solid #ded4c8;
      background: #fffaf4;
      color: #8b8178;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .platform-tab.active {
      background: #4a423b;
      color: white;
      border-color: #4a423b;
    }

    .platform-tab:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #81766d;
      margin-bottom: 8px;
    }

    .topic-box {
      background: #fffaf4;
      border: 1px solid #e5dbcf;
      border-radius: 16px;
      padding: 14px;
    }

    select {
      width: 100%;
      border: 1px solid #dcd1c5;
      background: white;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      color: #3f3933;
      outline: none;
    }

    select:focus {
      border-color: #9e9082;
    }

    .topic-description {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #7c7168;
      white-space: pre-wrap;
    }

    .post-card {
      background: #fffaf4;
      border: 1px solid #e5dbcf;
      border-radius: 16px;
      padding: 14px;
    }

    .message-box {
      background: white;
      border: 1px solid #e4d9cc;
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 14px;
      line-height: 1.55;
      min-height: 52px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    button.action-btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button.action-btn:hover {
      transform: translateY(-1px);
    }

    .random-btn {
      background: #eee6dc;
      color: #5e554e;
    }

    .post-btn,
    .reply-btn {
      background: #4a423b;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .usage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
      font-size: 12px;
      color: #8a7e74;
    }

    .reply-header {
      margin-top: 24px;
      margin-bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reply-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #81766d;
    }

    .reply-count {
      font-size: 12px;
      color: #9a8f85;
    }

    .reply-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reply-card {
      background: #fffaf4;
      border: 1px solid #e5dbcf;
      border-radius: 15px;
      overflow: hidden;
      transition: 0.2s ease;
    }

    .reply-card.replied {
      border-color: #d6cfc7;
      opacity: 0.82;
    }

    .reply-card-header {
      width: 100%;
      padding: 11px 13px;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .reply-card-header:hover {
      background: rgba(0, 0, 0, 0.015);
    }

    .reply-main-info {
      flex: 1;
      min-width: 0;
    }

    .reply-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }

    .priority {
      font-size: 10px;
      font-weight: 800;
      background: #ece3d8;
      color: #6e6258;
      border-radius: 999px;
      padding: 3px 7px;
    }

    .account {
      font-size: 12px;
      font-weight: 700;
      color: #574e47;
    }

    .reply-status {
      font-size: 10px;
      font-weight: 800;
      color: #8a7e74;
    }

    .tweet-id {
      font-size: 11px;
      color: #9a8f85;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      font-size: 16px;
      color: #91857a;
      transition: transform 0.2s ease;
    }

    .reply-card.open .chevron {
      transform: rotate(180deg);
    }

    .reply-card-body {
      display: none;
      padding: 0 13px 13px;
    }

    .reply-card.open .reply-card-body {
      display: block;
    }

    .target-post {
      font-size: 12px;
      line-height: 1.5;
      color: #81766d;
      background: #f7f1e8;
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .reply-message-box {
      background: white;
      border: 1px solid #e4d9cc;
      border-radius: 11px;
      padding: 10px 11px;
      font-size: 13px;
      line-height: 1.55;
      min-height: 48px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      padding: 28px 15px;
      color: #9a8f85;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      color: #9a8f85;
      font-size: 13px;
      padding: 15px;
    }

    .hidden {
      display: none !important;
    }

    .error {
      background: #fff0ed;
      border: 1px solid #f0cfc7;
      color: #9b5549;
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 760px);
        padding-top: 20px;
      }

      .title {
        font-size: 24px;
      }

      .button-row {
        flex-wrap: wrap;
      }

      button.action-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="title">🐘 GomGom Message</div>
      <div class="subtitle">
        Random message generator for X
      </div>
    </header>

    <div class="platform-tabs">
      <button class="platform-tab active">
        X
      </button>

      <button
        class="platform-tab"
        disabled
      >
        Instagram
      </button>

      <button
        class="platform-tab"
        disabled
      >
        TikTok
      </button>
    </div>

    <div id="errorBox" class="error hidden"></div>

    <!-- TOPIC -->
    <section class="section">
      <div class="section-label">
        TOPIC
      </div>

      <div class="topic-box">
        <select id="topicSelect">
          <option value="">
            Loading topics...
          </option>
        </select>

        <div
          id="topicDescription"
          class="topic-description"
        >
          -
        </div>
      </div>
    </section>

    <!-- POST -->
    <section class="section">
      <div class="section-label">
        POST
      </div>

      <div class="post-card">

        <div
          id="postMessage"
          class="message-box"
        >
          กด Random เพื่อสุ่มข้อความ
        </div>

        <div class="button-row">

          <button
            id="postRandomBtn"
            class="action-btn random-btn"
          >
            Random
          </button>

          <button
            id="postAgainBtn"
            class="action-btn random-btn hidden"
          >
            Again
          </button>

          <button
            id="postBtn"
            class="action-btn post-btn"
          >
            Post
          </button>

        </div>

        <div class="usage">
          <span>
            POST usage
          </span>

          <span id="postUsage">
            -
          </span>
        </div>

      </div>
    </section>

    <!-- REPLY -->
    <section class="section">

      <div class="reply-header">

        <div class="reply-title">
          REPLY
        </div>

        <div
          id="replyCount"
          class="reply-count"
        >
          -
        </div>

      </div>

      <div
        id="replyList"
        class="reply-list"
      >
        <div class="loading">
          Loading...
        </div>
      </div>

    </section>

  </div>

  <script>
    /* =========================================================
       CONFIG
    ========================================================= */

    const SPREADSHEET_ID =
      "YOUR_SPREADSHEET_ID";

    const SUPABASE_URL =
      "https://romrjbyaqckrpvobbzkw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_4DN0Penjs0vuTYzVdY4-Ug_AmsxurCE";


    /* =========================================================
       STATE
    ========================================================= */

    let topics = [];

    let currentTopic = null;

    let postMessages = [];

    let replyTweets = [];

    let currentPostMessage = null;


    /* =========================================================
       DOM
    ========================================================= */

    const topicSelect =
      document.getElementById(
        "topicSelect"
      );

    const topicDescription =
      document.getElementById(
        "topicDescription"
      );

    const postMessage =
      document.getElementById(
        "postMessage"
      );

    const postRandomBtn =
      document.getElementById(
        "postRandomBtn"
      );

    const postAgainBtn =
      document.getElementById(
        "postAgainBtn"
      );

    const postBtn =
      document.getElementById(
        "postBtn"
      );

    const postUsage =
      document.getElementById(
        "postUsage"
      );

    const replyList =
      document.getElementById(
        "replyList"
      );

    const replyCount =
      document.getElementById(
        "replyCount"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    /* =========================================================
       ERROR
    ========================================================= */

    function showError(message) {
      errorBox.textContent =
        message || "เกิดข้อผิดพลาด";

      errorBox.classList.remove(
        "hidden"
      );
    }

    function hideError() {
      errorBox.textContent = "";

      errorBox.classList.add(
        "hidden"
      );
    }


    /* =========================================================
       SUPABASE FETCH
    ========================================================= */

    async function supabaseFetch(
      path,
      options = {}
    ) {
      const response =
        await fetch(
          SUPABASE_URL + path,
          {
            ...options,

            headers: {
              apikey:
                SUPABASE_KEY,

              Authorization:
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              ...(options.headers || {})
            }
          }
        );

      const text =
        await response.text();

      let data = null;

      try {
        data =
          text
            ? JSON.parse(text)
            : null;
      } catch {
        data = text;
      }

      if (!response.ok) {
        console.error(
          "Supabase error:",
          response.status,
          data
        );

        throw new Error(
          typeof data === "string"
            ? data
            : JSON.stringify(data)
        );
      }

      return data;
    }


    /* =========================================================
       GOOGLE SHEETS CSV
    ========================================================= */

    function parseCSV(text) {
      const rows = [];

      let row = [];

      let value = "";

      let insideQuotes = false;

      for (
        let i = 0;
        i < text.length;
        i++
      ) {
        const char =
          text[i];

        const next =
          text[i + 1];

        if (
          char === '"' &&
          insideQuotes &&
          next === '"'
        ) {
          value += '"';

          i++;

          continue;
        }

        if (char === '"') {
          insideQuotes =
            !insideQuotes;

          continue;
        }

        if (
          char === "," &&
          !insideQuotes
        ) {
          row.push(value);

          value = "";

          continue;
        }

        if (
          (char === "\n" ||
            char === "\r") &&
          !insideQuotes
        ) {
          if (
            char === "\r" &&
            next === "\n"
          ) {
            i++;
          }

          row.push(value);

          value = "";

          if (
            row.some(
              item =>
                item.trim() !== ""
            )
          ) {
            rows.push(row);
          }

          row = [];

          continue;
        }

        value += char;
      }

      row.push(value);

      if (
        row.some(
          item =>
            item.trim() !== ""
        )
      ) {
        rows.push(row);
      }

      return rows;
    }


    async function loadSheet(
      sheetName
    ) {
      const url =
        "https://docs.google.com/spreadsheets/d/" +
        encodeURIComponent(
          SPREADSHEET_ID
        ) +
        "/gviz/tq?tqx=out:csv&sheet=" +
        encodeURIComponent(
          sheetName
        );

      const response =
        await fetch(url);

      if (!response.ok) {
        throw new Error(
          `โหลด sheet ${sheetName} ไม่สำเร็จ`
        );
      }

      const text =
        await response.text();

      const rows =
        parseCSV(text);

      if (!rows.length) {
        return [];
      }

      const headers =
        rows[0].map(
          h =>
            h
              .trim()
              .replace(
                /^\uFEFF/,
                ""
              )
        );

      return rows
        .slice(1)
        .map(row => {
          const obj = {};

          headers.forEach(
            (header, index) => {
              obj[header] =
                (
                  row[index] || ""
                ).trim();
            }
          );

          return obj;
        });
    }


    /* =========================================================
       LOAD TOPICS
    ========================================================= */

    async function loadTopics() {
      const rows =
        await loadSheet(
          "subject"
        );

      topics =
        rows
          .filter(
            row =>
              row.Topic_id
          )
          .map(row => ({
            topicId:
              row.Topic_id,

            topicName:
              row.Topic_name ||
              row.Topic_id,

            description:
              row.Topic_Desc ||
              "",

            postSheet:
              row.post_sheet ||
              ""
          }));

      topicSelect.innerHTML =
        "";

      if (!topics.length) {
        topicSelect.innerHTML =
          `
            <option value="">
              ไม่พบ Topic
            </option>
          `;

        return;
      }

      topics.forEach(
        topic => {
          const option =
            document.createElement(
              "option"
            );

          option.value =
            topic.topicId;

          option.textContent =
            topic.topicName;

          topicSelect.appendChild(
            option
          );
        }
      );

      currentTopic =
        topics[0];

      topicSelect.value =
        currentTopic.topicId;

      await handleTopicChange();
    }


    /* =========================================================
       TOPIC CHANGE
    ========================================================= */

    async function handleTopicChange() {
      hideError();

      const topicId =
        topicSelect.value;

      currentTopic =
        topics.find(
          topic =>
            String(
              topic.topicId
            ) ===
            String(topicId)
        );

      if (!currentTopic) {
        return;
      }

      topicDescription.textContent =
        currentTopic.description ||
        "-";

      postMessages = [];

      currentPostMessage =
        null;

      postMessage.textContent =
        "กด Random เพื่อสุ่มข้อความ";

      postAgainBtn.classList.add(
        "hidden"
      );

      await Promise.all([
        loadPostMessages(),
        loadReplyTweets()
      ]);

      await updatePostUsage();
    }


    /* =========================================================
       POST MESSAGES
    ========================================================= */

    async function loadPostMessages() {
      if (!currentTopic) {
        return;
      }

      let sheetName =
        currentTopic.postSheet;

      if (!sheetName) {
        sheetName =
          "P_" +
          currentTopic.topicId;
      }

      try {
        postMessages =
          await loadSheet(
            sheetName
          );
      } catch (error) {
        console.error(error);

        postMessages = [];

        showError(
          `โหลด POST ไม่สำเร็จ: ${error.message}`
        );
      }
    }


    /* =========================================================
       NEW GOMGOM POST CLAIM
       
       IMPORTANT:
       ใช้ claim_post_message_gomgom
       และ parameter ต้องเป็น p_topic
    ========================================================= */

    async function claimPost(
      topicId,
      messageId
    ) {
      const response =
        await supabaseFetch(
          "/rest/v1/rpc/claim_post_message_gomgom",
          {
            method: "POST",

            body:
              JSON.stringify({
                p_topic:
                  String(topicId),

                p_message_id:
                  String(messageId)
              })
          }
        );

      if (
        typeof response ===
        "boolean"
      ) {
        return response;
      }

      if (
        Array.isArray(response)
      ) {
        return response[0] === true;
      }

      return false;
    }


    /* =========================================================
       POST USAGE
       
       NOTE:
       จุดนี้ยังใช้ get_post_usage เดิม
       หากต้องการแยก usage ของ GomGom ด้วย
       ให้เปลี่ยนเป็น get_post_usage_gomgom
    ========================================================= */

    async function getPostUsage(
      topicId
    ) {
      const response =
        await supabaseFetch(
          "/rest/v1/rpc/get_post_usage",
          {
            method: "POST",

            body:
              JSON.stringify({
                p_topic_id:
                  String(topicId)
              })
          }
        );

      return (
        Number(response) || 0
      );
    }


    async function updatePostUsage() {
      if (!currentTopic) {
        return;
      }

      try {
        const used =
          await getPostUsage(
            currentTopic.topicId
          );

        const total =
          postMessages.length;

        const remaining =
          Math.max(
            total - used,
            0
          );

        postUsage.textContent =
          `${used} / ${total} used · ${remaining} left`;
      } catch (error) {
        console.error(
          "get post usage error:",
          error
        );

        postUsage.textContent =
          "-";
      }
    }


    /* =========================================================
       RANDOM POST
    ========================================================= */

    async function claimRandomPostMessage() {
      if (
        !currentTopic ||
        !postMessages.length
      ) {
        throw new Error(
          "ไม่พบข้อความ POST"
        );
      }

      const shuffled =
        [...postMessages];

      shuffleArray(
        shuffled
      );

      for (
        const message of shuffled
      ) {
        const messageId =
          message.message_id;

        if (
          !messageId
        ) {
          continue;
        }

        const claimed =
          await claimPost(
            currentTopic.topicId,
            messageId
          );

        if (claimed) {
          const used =
            await getPostUsage(
              currentTopic.topicId
            );

          const total =
            postMessages.length;

          const remaining =
            Math.max(
              total - used,
              0
            );

          return {
            message,

            total,

            used,

            remaining
          };
        }
      }

      return null;
    }


    async function randomPost() {
      hideError();

      if (
        !currentTopic
      ) {
        return;
      }

      if (
        !postMessages.length
      ) {
        showError(
          "Topic นี้ไม่มีข้อความ POST"
        );

        return;
      }

      postRandomBtn.disabled =
        true;

      postAgainBtn.disabled =
        true;

      try {
        const result =
          await claimRandomPostMessage();

        if (!result) {
          postMessage.textContent =
            "ข้อความ POST ถูกใช้ครบแล้ว";

          postAgainBtn.classList.add(
            "hidden"
          );

          postUsage.textContent =
            `${postMessages.length} / ${postMessages.length} used · 0 left`;

          return;
        }

        currentPostMessage =
          result.message;

        postMessage.textContent =
          getMessageText(
            result.message
          );

        postAgainBtn.classList.remove(
          "hidden"
        );

        postUsage.textContent =
          `${result.used} / ${result.total} used · ${result.remaining} left`;
      } catch (error) {
        console.error(error);

        showError(
          `สุ่ม POST ไม่สำเร็จ: ${error.message}`
        );
      } finally {
        postRandomBtn.disabled =
          false;

        postAgainBtn.disabled =
          false;
      }
    }


    /* =========================================================
       REPLY DATA
    ========================================================= */

    async function loadReplyTweets() {
      replyList.innerHTML =
        `
          <div class="loading">
            Loading...
          </div>
        `;

      replyTweets = [];

      if (!currentTopic) {
        return;
      }

      try {
        const rows =
          await loadSheet(
            "tw_subject"
          );

        replyTweets =
          rows
            .filter(
              row =>
                String(
                  row.Topic_id
                ) ===
                String(
                  currentTopic.topicId
                )
            )
            .sort(
              (a, b) =>
                Number(
                  b.priority || 0
                ) -
                Number(
                  a.priority || 0
                )
            );

        renderReplyTweets();
      } catch (error) {
        console.error(error);

        replyList.innerHTML =
          `
            <div class="empty">
              โหลด Reply ไม่สำเร็จ
            </div>
          `;

        showError(
          `โหลด Reply ไม่สำเร็จ: ${error.message}`
        );
      }
    }


    /* =========================================================
       REPLY MESSAGE
    ========================================================= */

    async function loadReplyMessages(
      tweetId
    ) {
      const sheetName =
        "R_" + tweetId;

      try {
        return await loadSheet(
          sheetName
        );
      } catch (error) {
        console.error(
          "load reply messages error:",
          error
        );

        return [];
      }
    }


    async function claimReply(
      topicId,
      tweetId,
      messageId
    ) {
      const response =
        await supabaseFetch(
          "/rest/v1/rpc/claim_reply_message",
          {
            method: "POST",

            body:
              JSON.stringify({
                p_topic_id:
                  String(topicId),

                p_tweet_id:
                  String(tweetId),

                p_message_id:
                  String(messageId)
              })
          }
        );

      if (
        typeof response ===
        "boolean"
      ) {
        return response;
      }

      if (
        Array.isArray(response)
      ) {
        return response[0] === true;
      }

      return false;
    }


    /* =========================================================
       RANDOM REPLY
    ========================================================= */

    async function claimRandomReplyMessage(
      tweetId,
      replyMessages
    ) {
      if (
        !currentTopic ||
        !replyMessages.length
      ) {
        return null;
      }

      const shuffled =
        [...replyMessages];

      shuffleArray(
        shuffled
      );

      for (
        const message of shuffled
      ) {
        const messageId =
          message.message_id;

        if (!messageId) {
          continue;
        }

        const claimed =
          await claimReply(
            currentTopic.topicId,
            tweetId,
            messageId
          );

        if (claimed) {
          return message;
        }
      }

      return null;
    }


    /* =========================================================
       RENDER REPLY CARDS
    ========================================================= */

    function renderReplyTweets() {
      replyList.innerHTML =
        "";

      replyCount.textContent =
        `${replyTweets.length} posts`;

      if (!replyTweets.length) {
        replyList.innerHTML =
          `
            <div class="empty">
              ไม่พบ Post สำหรับ Reply ใน Topic นี้
            </div>
          `;

        return;
      }

      replyTweets.forEach(
        (tweet, index) => {
          const card =
            createReplyCard(
              tweet,
              index
            );

          replyList.appendChild(
            card
          );
        }
      );
    }


    async function createReplyCard(
      tweet,
      index
    ) {
      const card =
        document.createElement(
          "div"
        );

      card.className =
        "reply-card";

      card.dataset.replied =
        "false";

      card.dataset.tweetId =
        tweet.tweet_id || "";


      /* HEADER */

      const header =
        document.createElement(
          "button"
        );

      header.type =
        "button";

      header.className =
        "reply-card-header";


      const mainInfo =
        document.createElement(
          "div"
        );

      mainInfo.className =
        "reply-main-info";


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "reply-meta";


      const priority =
        document.createElement(
          "span"
        );

      priority.className =
        "priority";

      priority.textContent =
        tweet.priority
          ? `P${tweet.priority}`
          : "P";


      const account =
        document.createElement(
          "span"
        );

      account.className =
        "account";

      account.textContent =
        tweet.acc_name
          ? "@" +
            tweet.acc_name.replace(
              /^@/,
              ""
            )
          : "";


      const status =
        document.createElement(
          "span"
        );

      status.className =
        "reply-status";


      meta.appendChild(
        priority
      );

      meta.appendChild(
        account
      );

      meta.appendChild(
        status
      );


      const tweetId =
        document.createElement(
          "div"
        );

      tweetId.className =
        "tweet-id";

      tweetId.textContent =
        maskTweetId(
          tweet.tweet_id
        );


      mainInfo.appendChild(
        meta
      );

      mainInfo.appendChild(
        tweetId
      );


      const chevron =
        document.createElement(
          "span"
        );

      chevron.className =
        "chevron";

      chevron.textContent =
        "⌄";


      header.appendChild(
        mainInfo
      );

      header.appendChild(
        chevron
      );


      /* BODY */

      const body =
        document.createElement(
          "div"
        );

      body.className =
        "reply-card-body";


      const targetPost =
        document.createElement(
          "div"
        );

      targetPost.className =
        "target-post";

      targetPost.textContent =
        tweet.tweet_desc ||
        tweet.link_post ||
        "";


      const messageBox =
        document.createElement(
          "div"
        );

      messageBox.className =
        "reply-message-box";

      messageBox.textContent =
        "กด Random เพื่อสุ่มข้อความ";


      const buttonRow =
        document.createElement(
          "div"
        );

      buttonRow.className =
        "button-row";


      const randomBtn =
        document.createElement(
          "button"
        );

      randomBtn.type =
        "button";

      randomBtn.className =
        "action-btn random-btn";

      randomBtn.textContent =
        "Random";


      const againBtn =
        document.createElement(
          "button"
        );

      againBtn.type =
        "button";

      againBtn.className =
        "action-btn random-btn hidden";

      againBtn.textContent =
        "Again";


      const replyBtn =
        document.createElement(
          "button"
        );

      replyBtn.type =
        "button";

      replyBtn.className =
        "action-btn reply-btn";

      replyBtn.textContent =
        "Reply";


      buttonRow.appendChild(
        randomBtn
      );

      buttonRow.appendChild(
        againBtn
      );

      buttonRow.appendChild(
        replyBtn
      );


      body.appendChild(
        targetPost
      );

      body.appendChild(
        messageBox
      );

      body.appendChild(
        buttonRow
      );


      card.appendChild(
        header
      );

      card.appendChild(
        body
      );


      /* =====================================================
         HEADER CLICK
      ===================================================== */

      header.addEventListener(
        "click",
        () => {
          const isOpen =
            card.classList.contains(
              "open"
            );

          document
            .querySelectorAll(
              ".reply-card.open"
            )
            .forEach(
              openCard => {
                openCard.classList.remove(
                  "open"
                );
              }
            );

          if (!isOpen) {
            card.classList.add(
              "open"
            );
          }
        }
      );


      /* =====================================================
         RANDOM
      ===================================================== */

      randomBtn.addEventListener(
        "click",
        async event => {
          event.stopPropagation();

          await randomReply(
            card,
            tweet,
            messageBox,
            randomBtn,
            againBtn,
            replyBtn,
            status
          );
        }
      );


      /* =====================================================
         AGAIN
      ===================================================== */

      againBtn.addEventListener(
        "click",
        async event => {
          event.stopPropagation();

          setReplyState(
            card,
            false
          );

          updateReplyState(
            card,
            status,
            replyBtn
          );

          await randomReply(
            card,
            tweet,
            messageBox,
            randomBtn,
            againBtn,
            replyBtn,
            status
          );
        }
      );


      /* =====================================================
         REPLY BUTTON
      ===================================================== */

      replyBtn.addEventListener(
        "click",
        event => {
          event.stopPropagation();

          const link =
            buildReplyIntentUrl(
              tweet.tweet_id,
              messageBox.textContent
            );

          if (!link) {
            showError(
              "ไม่พบ tweet_id หรือข้อความ Reply"
            );

            return;
          }

          window.open(
            link,
            "_blank"
          );

          setReplyState(
            card,
            true
          );

          updateReplyState(
            card,
            status,
            replyBtn
          );
        }
      );


      return card;
    }


    /* =========================================================
       RANDOM REPLY ACTION
    ========================================================= */

    async function randomReply(
      card,
      tweet,
      messageBox,
      randomBtn,
      againBtn,
      replyBtn,
      status
    ) {
      hideError();

      randomBtn.disabled =
        true;

      againBtn.disabled =
        true;

      replyBtn.disabled =
        true;

      try {
        const replyMessages =
          await loadReplyMessages(
            tweet.tweet_id
          );

        if (
          !replyMessages.length
        ) {
          messageBox.textContent =
            "ไม่พบข้อความ Reply";

          return;
        }

        const message =
          await claimRandomReplyMessage(
            tweet.tweet_id,
            replyMessages
          );

        if (!message) {
          messageBox.textContent =
            "ข้อความ Reply ถูกใช้ครบแล้ว";

          return;
        }

        messageBox.textContent =
          getMessageText(
            message
          );

        againBtn.classList.remove(
          "hidden"
        );

        setReplyState(
          card,
          false
        );

        updateReplyState(
          card,
          status,
          replyBtn
        );
      } catch (error) {
        console.error(error);

        showError(
          `สุ่ม Reply ไม่สำเร็จ: ${error.message}`
        );
      } finally {
        randomBtn.disabled =
          false;

        againBtn.disabled =
          false;

        replyBtn.disabled =
          false;
      }
    }


    /* =========================================================
       REPLY STATE
    ========================================================= */

    function setReplyState(
      card,
      replied
    ) {
      card.dataset.replied =
        replied
          ? "true"
          : "false";
    }


    function updateReplyState(
      card,
      headerStatus,
      replyBtn
    ) {
      const replied =
        card.dataset.replied ===
        "true";

      if (replied) {
        headerStatus.textContent =
          "✓ REPLIED";

        card.classList.add(
          "replied"
        );

        replyBtn.classList.add(
          "hidden"
        );
      } else {
        headerStatus.textContent =
          "";

        card.classList.remove(
          "replied"
        );

        replyBtn.classList.remove(
          "hidden"
        );
      }
    }


    /* =========================================================
       POST BUTTON
    ========================================================= */

    postBtn.addEventListener(
      "click",
      () => {
        if (
          !currentPostMessage
        ) {
          showError(
            "กรุณากด Random ก่อน"
          );

          return;
        }

        const text =
          getMessageText(
            currentPostMessage
          );

        const url =
          "https://x.com/intent/tweet?text=" +
          encodeURIComponent(
            text
          );

        window.open(
          url,
          "_blank"
        );
      }
    );


    /* =========================================================
       POST RANDOM BUTTON
    ========================================================= */

    postRandomBtn.addEventListener(
      "click",
      randomPost
    );


    postAgainBtn.addEventListener(
      "click",
      randomPost
    );


    /* =========================================================
       TOPIC SELECT
    ========================================================= */

    topicSelect.addEventListener(
      "change",
      handleTopicChange
    );


    /* =========================================================
       HELPERS
    ========================================================= */

    function shuffleArray(
      array
    ) {
      for (
        let i =
          array.length - 1;
        i > 0;
        i--
      ) {
        const j =
          Math.floor(
            Math.random() *
              (i + 1)
          );

        [
          array[i],
          array[j]
        ] = [
          array[j],
          array[i]
        ];
      }

      return array;
    }


    function getMessageText(
      message
    ) {
      if (!message) {
        return "";
      }

      if (
        message.message !==
        undefined
      ) {
        return String(
          message.message
        );
      }

      if (
        message.Message !==
        undefined
      ) {
        return String(
          message.Message
        );
      }

      if (
        message.text !==
        undefined
      ) {
        return String(
          message.text
        );
      }

      if (
        message.Text !==
        undefined
      ) {
        return String(
          message.Text
        );
      }

      return "";
    }


    function maskTweetId(
      tweetId
    ) {
      if (!tweetId) {
        return "-";
      }

      const id =
        String(tweetId);

      if (id.length <= 8) {
        return id;
      }

      return (
        id.slice(0, 4) +
        "..." +
        id.slice(-4)
      );
    }


    function buildReplyIntentUrl(
      tweetId,
      text
    ) {
      if (
        !tweetId ||
        !text
      ) {
        return "";
      }

      return (
        "https://x.com/intent/tweet" +
        "?in_reply_to=" +
        encodeURIComponent(
          String(tweetId)
        ) +
        "&text=" +
        encodeURIComponent(
          String(text)
        )
      );
    }


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    async function init() {
      hideError();

      try {
        await loadTopics();
      } catch (error) {
        console.error(error);

        showError(
          `โหลดข้อมูลไม่สำเร็จ: ${error.message}`
        );

        topicSelect.innerHTML =
          `
            <option value="">
              โหลดข้อมูลไม่สำเร็จ
            </option>
          `;

        replyList.innerHTML =
          `
            <div class="empty">
              ไม่สามารถโหลดข้อมูลได้
            </div>
          `;
      }
    }


    init();
  </script>
