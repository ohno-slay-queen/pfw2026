<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GomGom Message</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    button,
    select {
      font: inherit;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: 20px auto 40px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       PLATFORM
    ========================= */

    .platform-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .platform-tab {
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      color: #777;
      font-weight: 600;
    }

    .platform-tab.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    /* =========================
       TOPIC
    ========================= */

    .topic-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .topic-select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      padding: 10px 12px;
      outline: none;
    }

    .topic-select:focus {
      border-color: #999;
    }

    .topic-description {
      margin-top: 9px;
      padding: 9px 11px;
      background: #fafafa;
      border-radius: 8px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
      white-space: normal;
    }

    /* =========================
       COUNTER
    ========================= */

    .usage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
      font-size: 12px;
      color: #777;
    }

    .usage-count {
      font-weight: 700;
      color: #222;
    }

    .progress {
      height: 5px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #222;
      transition: width 0.2s ease;
    }

    /* =========================
       MESSAGE BOX
    ========================= */

    .message-box {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fafafa;
      padding: 13px 14px;
      min-height: 80px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-message {
      color: #aaa;
      text-align: center;
      padding: 10px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .button-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 11px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 9px 15px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .btn-primary {
      background: #111;
      color: white;
    }

    .btn-secondary {
      background: #eee;
      color: #222;
    }

    .btn-x {
      background: #111;
      color: white;
    }

    .btn-reply {
      background: #eee;
      color: #222;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       REPLY SECTION
    ========================= */

    .reply-section {
      margin-top: 15px;
    }

    .reply-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .reply-title {
      font-size: 15px;
      font-weight: 800;
    }

    .reply-count {
      font-size: 12px;
      color: #777;
    }

    /* =========================
       REPLY CARD
    ========================= */

    .reply-card {
      border: 1px solid #e4e4e4;
      border-radius: 9px;
      overflow: hidden;
      margin-bottom: 7px;
      background: white;
    }

    .reply-card.replied {
      border-color: #cfcfcf;
    }

    .reply-header {
      width: 100%;
      border: 0;
      background: white;
      cursor: pointer;
      padding: 10px 12px;
      text-align: left;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reply-header:hover {
      background: #fafafa;
    }

    .reply-header-left {
      flex: 1;
      min-width: 0;
    }

    .reply-account {
      font-size: 13px;
      font-weight: 800;
    }

    .reply-meta {
      margin-top: 2px;
      font-size: 11px;
      color: #999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reply-status {
      font-size: 11px;
      font-weight: 800;
      color: #555;
      white-space: nowrap;
    }

    .reply-arrow {
      color: #999;
      font-size: 12px;
      transition: transform 0.15s ease;
    }

    .reply-card.open .reply-arrow {
      transform: rotate(180deg);
    }

    .reply-body {
      display: none;
      padding: 0 12px 12px;
    }

    .reply-card.open .reply-body {
      display: block;
    }

    .reply-message {
      background: #fafafa;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reply-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 8px;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 15px;
    }

    .error {
      background: #fff1f1;
      border: 1px solid #ffd0d0;
      color: #c33;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      background: #f1fff4;
      border: 1px solid #cdeed4;
      color: #28733a;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 16px);
        margin-top: 12px;
      }

      .card {
        padding: 12px;
      }

      .title {
        font-size: 22px;
      }

      .message-box {
        max-width: 100%;
      }

      .btn {
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================

  <div class="platform-tabs">

  <!-- =========================

    </div>

    <div

      style="margin-top:0; margin-bottom:6px;"
    >
      <span>
        เหลือข้อความ Reply

      <span

      >
        -

    <div class="progress">
      <div
        id="replyProgress"

<script>
/* =========================================================
   CONFIG
========================================================= */

const MAIN_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CnwPK2fSRjsBrmWn3XVIXZEbDFPGguJQeco7B4nNv-7YOcxmIk0ge1846CC5OB8o3sqWK7TwIo_a/pub?output=csv";

const SPREADSHEET_ID =
  "1RJ7OzLLgvMSKdVTxVfKOqQXir7vXIIyWpa_gImp1PzM";

const SUPABASE_URL =
  "https://romrjbyaqckrpvobbzkw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4DN0Penjs0vuTYzVdY4-Ug_AmsxurCE";


/* =========================================================
   STATE
========================================================= */

let topics = [];

let currentTopic = null;

let postMessages = [];
let currentPost = null;

let replyTweets = [];
let replyCardsData = [];

let currentReplyTweet = null;


/* =========================================================
   DOM
========================================================= */

const topicSelect =
  document.getElementById("topicSelect");

const topicDescription =
  document.getElementById("topicDescription");

const postMessage =
  document.getElementById("postMessage");

const postUsage =
  document.getElementById("postUsage");

const postProgress =
  document.getElementById("postProgress");

const randomPostBtn =
  document.getElementById("randomPostBtn");

const againPostBtn =
  document.getElementById("againPostBtn");

const postXBtn =
  document.getElementById("postXBtn");

const replySection =
  document.getElementById("replySection");

const replyCards =
  document.getElementById("replyCards");

const replyCount =
  document.getElementById("replyCount");

const replyUsage =
  document.getElementById("replyUsage");

const replyProgress =
  document.getElementById("replyProgress");

const errorArea =
  document.getElementById("errorArea");


/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(path, options = {}) {

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {

    throw new Error(
      `Supabase error ${response.status}: ` +
      (typeof data === "string"
        ? data
        : JSON.stringify(data))
    );
  }

  return data;
}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  errorArea.innerHTML = `
    <div class="error">
      ${escapeHtml(message)}
    </div>
  `;
}


function clearError() {
  errorArea.innerHTML = "";
}


/* =========================================================
   GOOGLE SHEETS
========================================================= */

async function loadSheet(sheetName) {

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    encodeURIComponent(SPREADSHEET_ID) +
    "/gviz/tq?tqx=out:csv&sheet=" +
    encodeURIComponent(sheetName) +
    "&t=" +
    Date.now();

  const response = await fetch(
    url,
    {
      cache: "no-store"
    }
  );

  if (!response.ok) {
    throw new Error(
      `Google Sheet error ${response.status}`
    );
  }

  const csvText = await response.text();

  return parseCSV(csvText);
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";

  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {

      cell += '"';
      i++;

    } else if (char === '"') {

      insideQuotes = !insideQuotes;

    } else if (char === "," && !insideQuotes) {

      row.push(cell);
      cell = "";

    } else if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
    ) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell);
      cell = "";

      if (
        row.length > 1 ||
        String(row[0] || "").trim() !== ""
      ) {
        rows.push(row);
      }

      row = [];

    } else {

      cell += char;

    }
  }

  if (cell !== "" || row.length > 0) {

    row.push(cell);

    if (
      row.length > 1 ||
      String(row[0] || "").trim() !== ""
    ) {
      rows.push(row);
    }
  }

  if (!rows.length) {
    return [];
  }

  const headers = rows[0].map(
    h => String(h || "").trim()
  );

  return rows
    .slice(1)
    .map(values => {

      const obj = {};

      headers.forEach((header, index) => {
        obj[header] =
          values[index] !== undefined
            ? values[index]
            : "";
      });

      return obj;
    });
}


/* =========================================================
   TOPICS
========================================================= */

async function loadTopics() {

  const rows = await loadSheet("main");

  topics = rows
    .map(row => ({
      topicId:
        String(row.Topic_id || "").trim(),

      topicName:
        String(row.Topic_name || "").trim(),

      topicDesc:
        String(row.Topic_Desc || "").trim(),

      postSheet:
        String(row.post_sheet || "").trim()
    }))
    .filter(row => row.topicId);


  topicSelect.innerHTML = `
    <option value="">
      -- เลือก Topic --
    </option>
  `;

  topics.forEach(topic => {

    const option =
      document.createElement("option");

    option.value = topic.topicId;

    option.textContent =
      topic.topicName ||
      topic.topicId;

    topicSelect.appendChild(option);
  });
}


/* =========================================================
   TOPIC SELECT
========================================================= */

topicSelect.addEventListener(
  "change",
  async () => {

    clearError();

    const topicId =
      topicSelect.value;

    if (!topicId) {

      currentTopic = null;

      topicDescription.classList.add("hidden");

      resetPostUI();

      return;
    }

    currentTopic =
      topics.find(
        topic =>
          String(topic.topicId) ===
          String(topicId)
      );

    if (!currentTopic) {
      return;
    }

    renderTopicDescription(
      currentTopic.topicDesc
    );

    resetPostUI();

    try {

      await loadPostMessages();

      await updatePostUsage();

    } catch (error) {

      console.error(error);

      showError(error.message);
    }
  }
);


/* =========================================================
   TOPIC DESCRIPTION
========================================================= */

function renderTopicDescription(description) {

  if (!description) {

    topicDescription.classList.add("hidden");

    topicDescription.innerHTML = "";

    return;
  }

  topicDescription.innerHTML =
    formatTopicDescription(description);

  topicDescription.classList.remove("hidden");
}


function formatTopicDescription(text) {

  return escapeHtml(text)
    .replace(/&lt;br\s*\/?&gt;/gi, "<br>");
}


/* =========================================================
   POST SHEET NAME
========================================================= */

function getPostSheetName(topic) {

  if (topic.postSheet) {
    return topic.postSheet;
  }

  return `P_${topic.topicId}`;
}


/* =========================================================
   LOAD POST MESSAGES
========================================================= */

async function loadPostMessages() {

  if (!currentTopic) {
    postMessages = [];
    return;
  }

  const sheetName =
    getPostSheetName(currentTopic);

  const rows =
    await loadSheet(sheetName);

  postMessages = rows
    .map((row, index) => {

      const message =
        String(
          row.message ||
          row.Message ||
          row.text ||
          row.Text ||
          row.msg ||
          row.Message_text ||
          ""
        ).trim();

      const messageId =
        String(
          row.message_id ||
          row.Message_id ||
          row.id ||
          row.ID ||
          index + 1
        ).trim();

      return {
        messageId,
        message
      };
    })
    .filter(row => row.message);
}


/* =========================================================
   POST CLAIM
   =========================================================
   
   IMPORTANT:
   เว็บนี้ใช้ function ใหม่:
   
   claim_post_message_gomgom
   
   ไม่แตะ:
   
   claim_post_message
   
========================================================= */

async function claimPost(topicId, messageId) {

  const response =
    await supabaseFetch(
      "/rest/v1/rpc/claim_post_message_gomgom",
      {
        method: "POST",

        body: JSON.stringify({
          p_topic:
            String(topicId),

          p_message_id:
            String(messageId)
        })
      }
    );

  return response === true;
}


/* =========================================================
   GET POST USAGE
========================================================= */

async function getPostUsage(topicId) {

  const response =
    await supabaseFetch(
      "/rest/v1/rpc/get_post_usage",
      {
        method: "POST",

        body: JSON.stringify({
          p_topic_id:
            String(topicId)
        })
      }
    );

  return response;
}


/* =========================================================
   UPDATE POST USAGE
========================================================= */

async function updatePostUsage() {

  if (!currentTopic) {
    return;
  }

  try {

    const usage =
      await getPostUsage(
        currentTopic.topicId
      );

    let used = 0;
    let total = postMessages.length;

    if (typeof usage === "number") {

      used = usage;

    } else if (
      usage &&
      typeof usage === "object"
    ) {

      used =
        Number(
          usage.used ??
          usage.count ??
          usage.total ??
          0
        );
    }

    const remaining =
      Math.max(
        0,
        total - used
      );

    postUsage.textContent =
      `${remaining} / ${total}`;

    const percentage =
      total > 0
        ? Math.min(
            100,
            Math.round(
              (used / total) * 100
            )
          )
        : 0;

    postProgress.style.width =
      `${percentage}%`;

  } catch (error) {

    console.error(
      "getPostUsage error:",
      error
    );

    postUsage.textContent =
      `${postMessages.length}`;
  }
}


/* =========================================================
   RANDOM POST
========================================================= */

async function randomPost() {

  clearError();

  if (!currentTopic) {

    showError(
      "กรุณาเลือก Topic ก่อน"
    );

    return;
  }

  if (!postMessages.length) {

    showError(
      "ไม่พบข้อความใน Post Sheet"
    );

    return;
  }

  randomPostBtn.disabled = true;
  againPostBtn.disabled = true;

  try {

    /*
     * สุ่มตามลำดับ:
     * 1. shuffle
     * 2. claim
     * 3. ใช้เฉพาะ message ที่ claim สำเร็จ
     */

    const shuffled =
      shuffle([...postMessages]);

    let claimedPost = null;

    for (
      const message of shuffled
    ) {

      const claimed =
        await claimPost(
          currentTopic.topicId,
          message.messageId
        );

      if (claimed) {

        claimedPost =
          message;

        break;
      }
    }

    if (!claimedPost) {

      showError(
        "ข้อความ Post ใน Topic นี้ถูกใช้หมดแล้ว"
      );

      postMessage.innerHTML = `
        <div class="empty-message">
          ไม่มีข้อความเหลือแล้ว
        </div>
      `;

      currentPost = null;

      postXBtn.classList.add("hidden");
      againPostBtn.classList.add("hidden");

      await updatePostUsage();

      return;
    }

    currentPost =
      claimedPost;

    postMessage.textContent =
      currentPost.message;

    againPostBtn.classList.remove(
      "hidden"
    );

    postXBtn.classList.remove(
      "hidden"
    );

    /*
     * Reply ใหม่ทุกครั้งที่สุ่ม Post
     */
    await loadReplyTweets();

    await updatePostUsage();

  } catch (error) {

    console.error(error);

    showError(error.message);

  } finally {

    randomPostBtn.disabled = false;
    againPostBtn.disabled = false;
  }
}


/* =========================================================
   AGAIN POST
========================================================= */

async function againPost() {

  clearError();

  /*
   * AGAIN ต้อง claim message ใหม่
   */
  await randomPost();
}


/* =========================================================
   POST X
========================================================= */

postXBtn.addEventListener(
  "click",
  () => {

    if (!currentPost) {
      return;
    }

    const url =
      createPostUrl(
        currentPost.message
      );

    openX(url);
  }
);


/* =========================================================
   RANDOM POST BUTTON
========================================================= */

randomPostBtn.addEventListener(

/* =========================================================
   REPLY SHEETS
========================================================= */

async function getReplyTweets(
  tweetId
) {

  const sheetName =
    `R_${tweetId}`;

  const rows =
    await loadSheet(sheetName);

  return rows
    .map((row, index) => {

      const message =
        String(
          row.message ||
          row.Message ||
          row.text ||
          row.Text ||
          row.reply ||
          row.Reply ||
          ""
        ).trim();

      const messageId =
        String(
          row.message_id ||
          row.Message_id ||
          row.id ||
          row.ID ||
          index + 1
        ).trim();

      return {
        messageId,
        message
      };

    })
    .filter(row => row.message);
}


/* =========================================================
   LOAD REPLY TWEETS
========================================================= */

async function loadReplyTweets() {

  replyCards.innerHTML = "";

  replySection.classList.add(
    "hidden"
  );

  replyTweets = [];
  replyCardsData = [];

  if (!currentPost) {
    return;
  }

  /*
   * currentPost อาจมี tweet_id
   * หรือ tweet ID อาจถูกเก็บใน column อื่น
   */

  const tweetId =
    String(
      currentPost.tweet_id ||
      currentPost.tweetId ||
      ""
    ).trim();

  /*
   * ถ้า POST sheet ไม่มี tweet_id
   * จะไม่สามารถโหลด R_<tweet_id>
   */

  if (!tweetId) {
    return;
  }

  try {

    replyTweets =
      await getReplyTweets(
        tweetId
      );

    if (!replyTweets.length) {
      return;
    }

    replySection.classList.remove(
      "hidden"
    );

    replyCount.textContent =
      `${replyTweets.length} posts`;

    await renderReplyCards(
      tweetId
    );

    await updateReplyUsage(
      tweetId
    );

  } catch (error) {

    console.error(
      "loadReplyTweets error:",
      error
    );

    showError(
      `โหลด Reply ไม่สำเร็จ: ${error.message}`
    );
  }
}


/* =========================================================
   CLAIM REPLY
========================================================= */

async function claimReply(
  tweetId,
  messageId
) {

  const response =
    await supabaseFetch(
      "/rest/v1/rpc/claim_reply",
      {
        method: "POST",

        body: JSON.stringify({
          p_tweet_id:
            String(tweetId),

          p_message_id:
            String(messageId)
        })
      }
    );

  return response === true;
}


/* =========================================================
   GET REPLY USAGE
========================================================= */

async function getReplyUsage(
  tweetId
) {

  const response =
    await supabaseFetch(
      "/rest/v1/rpc/get_reply_usage",
      {
        method: "POST",

        body: JSON.stringify({
          p_tweet_id:
            String(tweetId)
        })
      }
    );

  return response;
}


/* =========================================================
   UPDATE REPLY USAGE
========================================================= */

async function updateReplyUsage(
  tweetId
) {

  try {

    const usage =
      await getReplyUsage(
        tweetId
      );

    let used = 0;

    if (typeof usage === "number") {

      used = usage;

    } else if (
      usage &&
      typeof usage === "object"
    ) {

      used =
        Number(
          usage.used ??
          usage.count ??
          usage.total ??
          0
        );
    }

    const total =
      replyTweets.length;

    const remaining =
      Math.max(
        0,
        total - used
      );

    replyUsage.textContent =
      `${remaining} / ${total}`;

    const percentage =
      total > 0
        ? Math.min(
            100,
            Math.round(
              (used / total) * 100
            )
          )
        : 0;

    replyProgress.style.width =
      `${percentage}%`;

  } catch (error) {

    console.error(
      "getReplyUsage error:",
      error
    );

    replyUsage.textContent =
      `${replyTweets.length}`;
  }
}


/* =========================================================
   RENDER REPLY CARDS
========================================================= */

async function renderReplyCards(
  tweetId
) {

  replyCards.innerHTML = "";

  /*
   * สุ่มลำดับ Reply Tweet
   */
  const tweets =
    shuffle([...replyTweets]);

  for (
    const tweet of tweets
  ) {

    /*
     * สร้าง card ก่อน
     */
    const card =
      createReplyCard(
        tweetId,
        tweet
      );

    replyCards.appendChild(
      card
    );
  }
}


/* =========================================================
   CREATE REPLY CARD
========================================================= */

function createReplyCard(
  tweetId,
  tweet
) {

  const card =
    document.createElement("div");

  card.className =
    "reply-card";

  card.dataset.replied =
    "false";

  card.dataset.tweetId =
    String(tweetId);

  card.dataset.messageId =
    String(tweet.messageId);


  /* -------------------------
     Header
  ------------------------- */

  const header =
    document.createElement("button");

  header.type =
    "button";

  header.className =
    "reply-header";


  const headerLeft =
    document.createElement("div");

  headerLeft.className =
    "reply-header-left";


  const account =
    document.createElement("div");

  account.className =
    "reply-account";

  account.textContent =
    "@reply";


  const meta =
    document.createElement("div");

  meta.className =
    "reply-meta";

  meta.textContent =
    `Tweet ID: ${maskTweetId(tweetId)}`;


  headerLeft.appendChild(
    account
  );

  headerLeft.appendChild(
    meta
  );


  const headerStatus =
    document.createElement("span");

  headerStatus.className =
    "reply-status";


  const arrow =
    document.createElement("span");

  arrow.className =
    "reply-arrow";

  arrow.textContent =
    "▼";


  header.appendChild(
    headerLeft
  );

  header.appendChild(
    headerStatus
  );

  header.appendChild(
    arrow
  );


  /* -------------------------
     Body
  ------------------------- */

  const body =
    document.createElement("div");

  body.className =
    "reply-body";


  const message =
    document.createElement("div");

  message.className =
    "reply-message";

  message.textContent =
    "กด RANDOM เพื่อสุ่ม Reply";


  const actions =
    document.createElement("div");

  actions.className =
    "reply-actions";


  const randomReplyBtn =
    document.createElement("button");

  randomReplyBtn.type =
    "button";

  randomReplyBtn.className =
    "btn btn-primary";

  randomReplyBtn.textContent =
    "RANDOM";


  const againReplyBtn =
    document.createElement("button");

  againReplyBtn.type =
    "button";

  againReplyBtn.className =
    "btn btn-secondary hidden";

  againReplyBtn.textContent =
    "AGAIN";


  const replyXBtn =
    document.createElement("button");

  replyXBtn.type =
    "button";

  replyXBtn.className =
    "btn btn-reply hidden";

  replyXBtn.textContent =
    "REPLY X";


  actions.appendChild(
    randomReplyBtn
  );

  actions.appendChild(
    againReplyBtn
  );

  actions.appendChild(
    replyXBtn
  );


  body.appendChild(
    message
  );

  body.appendChild(
    actions
  );


  card.appendChild(
    header
  );

  card.appendChild(
    body
  );


  /* =========================================================
     ACCORDION
  ========================================================= */

  header.addEventListener(
    "click",
    () => {

      const isOpen =
        card.classList.contains(
          "open"
        );

      /*
       * เปิดได้ทีละใบ
       */

      document
        .querySelectorAll(
          ".reply-card.open"
        )
        .forEach(
          otherCard => {

            if (
              otherCard !== card
            ) {
              otherCard.classList.remove(
                "open"
              );
            }
          }
        );

      card.classList.toggle(
        "open",
        !isOpen
      );
    }
  );


  /* =========================================================
     RANDOM REPLY
  ========================================================= */

  randomReplyBtn.addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      await randomReplyForCard(
        card,
        tweetId,
        tweet,
        message,
        headerStatus,
        randomReplyBtn,
        againReplyBtn,
        replyXBtn
      );
    }
  );


  /* =========================================================
     AGAIN REPLY
  ========================================================= */

  againReplyBtn.addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      await randomReplyForCard(
        card,
        tweetId,
        tweet,
        message,
        headerStatus,
        randomReplyBtn,
        againReplyBtn,
        replyXBtn
      );
    }
  );


  /* =========================================================
     REPLY X
  ========================================================= */

  replyXBtn.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      const replyMessage =
        message.textContent;

      if (
        !replyMessage ||
        replyMessage ===
        "กด RANDOM เพื่อสุ่ม Reply"
      ) {
        return;
      }

      const url =
        createReplyUrl(
          tweetId,
          replyMessage
        );

      openX(url);

      /*
       * กด Reply X แล้ว
       * เปลี่ยนสถานะ local เป็น REPLIED
       */

      setReplyState(
        card,
        true
      );

      updateReplyState(
        card,
        headerStatus,
        replyXBtn
      );
    }
  );


  return card;
}


/* =========================================================
   RANDOM REPLY FOR CARD
========================================================= */

async function randomReplyForCard(
  card,
  tweetId,
  tweet,
  messageElement,
  headerStatus,
  randomReplyBtn,
  againReplyBtn,
  replyXBtn
) {

  clearError();

  randomReplyBtn.disabled = true;
  againReplyBtn.disabled = true;

  try {

    const shuffled =
      shuffle([...replyTweets]);

    let claimedReplyMessage =
      null;

    for (
      const reply of shuffled
    ) {

      const claimed =
        await claimReply(
          tweetId,
          reply.messageId
        );

      if (claimed) {

        claimedReplyMessage =
          reply;

        break;
      }
    }

    if (!claimedReplyMessage) {

      showError(
        "Reply ของ Tweet นี้ถูกใช้หมดแล้ว"
      );

      messageElement.textContent =
        "ไม่มี Reply เหลือแล้ว";

      return;
    }

    messageElement.textContent =
      claimedReplyMessage.message;

    againReplyBtn.classList.remove(
      "hidden"
    );

    replyXBtn.classList.remove(
      "hidden"
    );

    /*
     * AGAIN ต้องเริ่มสถานะใหม่
     */

    setReplyState(
      card,
      false
    );

    updateReplyState(
      card,
      headerStatus,
      replyXBtn
    );


    await updateReplyUsage(
      tweetId
    );

  } catch (error) {

    console.error(error);

    showError(
      error.message
    );

  } finally {

    randomReplyBtn.disabled = false;
    againReplyBtn.disabled = false;
  }
}


/* =========================================================
   REPLY STATE
========================================================= */

function setReplyState(
  card,
  replied
) {

  card.dataset.replied =
    replied
      ? "true"
      : "false";
}


function updateReplyState(
  card,
  headerStatus,
  replyBtn
) {

  const replied =
    card.dataset.replied ===
    "true";

  if (replied) {

    headerStatus.textContent =
      "✓ REPLIED";

    card.classList.add(
      "replied"
    );

    replyBtn.classList.add(
      "hidden"
    );

  } else {

    headerStatus.textContent =
      "";

    card.classList.remove(
      "replied"
    );

  }
}


/* =========================================================
   POST URL
========================================================= */

function createPostUrl(
  message
) {

  return (
    "https://x.com/intent/tweet?text=" +
    encodeURIComponent(
      message
    )
  );
}


/* =========================================================
   REPLY URL
========================================================= */

function createReplyUrl(
  tweetId,
  message
) {

  return (
    "https://x.com/intent/tweet" +
    "?in_reply_to=" +
    encodeURIComponent(
      tweetId
    ) +
    "&text=" +
    encodeURIComponent(
      message
    )
  );
}


/* =========================================================
   OPEN X
========================================================= */

function openX(url) {

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   VALID TWEET ID
========================================================= */

function isValidTweetId(
  tweetId
) {

  return /^\d+$/.test(
    String(tweetId || "")
  );
}


/* =========================================================
   MASK TWEET ID
========================================================= */

function maskTweetId(
  tweetId
) {

  const value =
    String(tweetId || "");

  if (value.length <= 6) {
    return value;
  }

  return (
    value.slice(0, 3) +
    "..." +
    value.slice(-3)
  );
}


/* =========================================================
   FORMAT COUNT
========================================================= */

function formatCount(
  value
) {

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {
    return "0";
  }

  return number.toLocaleString(
    "en-US"
  );
}


/* =========================================================
   PRIORITY
========================================================= */

function normalizePriority(
  value
) {

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {
    return 0;
  }

  return number;
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];
  }

  return array;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
