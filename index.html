<script>


/* =========================================================
   CONFIG
========================================================= */


/*
 * Google Sheet MAIN

 * เอา URL CSV ของ main มาใส่
 *
 * ตัวอย่าง:
 *
 * https://docs.google.com/spreadsheets/d/XXXXX/
 * pub?gid=0&single=true&output=csv
 */

const MAIN_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CnwPK2fSRjsBrmWn3XVIXZEbDFPGguJQeco7B4nNv-7YOcxmIk0ge1846CC5OB8o3sqWK7TwIo_a/pub?output=csv";


/*
 * Google Spreadsheet ID
 *
 * จาก URL:
 *
 * https://docs.google.com/spreadsheets/d/
 * 1ABCXYZ123456/edit
 *
 * เอาเฉพาะ:
 *
 * 1ABCXYZ123456
 */

const SPREADSHEET_ID =
  "1RJ7OzLLgvMSKdVTxVfKOqQXir7vXIIyWpa_gImp1PzM";


/*
 * Supabase URL
 *
 * สำคัญ:
 *
 * ใส่เฉพาะ:
 *
 * https://xxxxx.supabase.co
 *
 * ไม่ใส่ /rest/v1
 */

const SUPABASE_URL =
  "https://romrjbyaqckrpvobbzkw.supabase.co";


/*
 * Supabase Publishable Key
 *
 * หรือ legacy anon key
 *
 * ห้ามใช้ secret/service_role
 */

const SUPABASE_KEY =
  "sb_publishable_4DN0Penjs0vuTYzVdY4-Ug_AmsxurCE";



/* =========================================================
   DOM
========================================================= */

const topicSelect =
  document.getElementById(
    "topicSelect"
  );


const tweetList =
  document.getElementById(
    "tweetList"
  );


const loading =
  document.getElementById(
    "loading"
  );


const errorBox =
  document.getElementById(
    "error"
  );



/* =========================================================
   STATE
========================================================= */

let mainRows = [];

let selectedTopic = "";


/*
 * cache message ของแต่ละ Tweet
 *
 * key:
 * tweet_id
 *
 * value:
 * {
 *   totalCount,
 *   messages
 * }
 */

const messageCache =
  new Map();



/* =========================================================
   INIT
========================================================= */

init();


async function init() {

  try {

    await loadMain();

    buildTopics();

    loading.style.display =
      "none";

  }

  catch (error) {

    console.error(error);

    loading.style.display =
      "none";

    showError(
      error.message
    );

  }

}



/* =========================================================
   LOAD MAIN
========================================================= */

async function loadMain() {

  const url =
    addCacheBuster(
      MAIN_CSV_URL
    );


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "โหลด main ไม่สำเร็จ"
    );

  }


  const csv =
    await response.text();


  mainRows =
    csvToObjects(csv);


  if (
    !mainRows.length
  ) {

    throw new Error(
      "main ไม่มีข้อมูล"
    );

  }


  /*
   * ตรวจ column
   */

  const requiredColumns = [
    "Topic",
    "acc_name",
    "link_post",
    "tweet_id"
  ];


  for (
    const column
    of requiredColumns
  ) {

    if (
      !(column in mainRows[0])
    ) {

      throw new Error(
        `main ไม่มี column: ${column}`
      );

    }

  }

}



/* =========================================================
   BUILD TOPICS
========================================================= */

function buildTopics() {

  const topics =
    [
      ...new Set(
        mainRows
          .map(row =>
            row.Topic.trim()
          )
          .filter(Boolean)
      )
    ];


  topics.sort();


  topics.forEach(
    topic => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        topic;


      option.textContent =
        topic;


      topicSelect.appendChild(
        option
      );

    }
  );

}



/* =========================================================
   TOPIC CHANGE
========================================================= */

topicSelect.addEventListener(
  "change",
  () => {

    selectedTopic =
      topicSelect.value;


    if (
      !selectedTopic
    ) {

      tweetList.innerHTML = `
        <div class="empty">
          กรุณาเลือก Topic
        </div>
      `;

      return;

    }


    renderTweetCards();

  }
);



/* =========================================================
   RENDER TWEET CARDS
========================================================= */

function renderTweetCards() {

  tweetList.innerHTML = "";


  /*
   * filter Topic
   */

  const topicRows =
    mainRows.filter(
      row =>
        row.Topic.trim() ===
        selectedTopic
    );


  /*
   * Tweet ID ไม่ซ้ำ
   */

  const uniqueTweets =
    new Map();


  topicRows.forEach(
    row => {

      const tweetId =
        row.tweet_id.trim();


      if (!tweetId) {
        return;
      }


      if (
        !uniqueTweets.has(
          tweetId
        )
      ) {

        uniqueTweets.set(
          tweetId,
          row
        );

      }

    }
  );


  /*
   * ไม่มี Tweet
   */

  if (
    uniqueTweets.size === 0
  ) {

    tweetList.innerHTML = `
      <div class="empty">
        ไม่พบ Tweet ใน Topic นี้
      </div>
    `;

    return;

  }


  /*
   * สร้าง card
   */

  uniqueTweets.forEach(
    tweet => {

      const card =
        createTweetCard(
          tweet
        );


      tweetList.appendChild(
        card
      );


      /*
       * โหลดข้อมูลของ Tweet
       * เพื่อเอาจำนวน message
       */

      loadTweetDataForCard(
        card,
        tweet.tweet_id.trim()
      );

    }
  );

}



/* =========================================================
   CREATE TWEET CARD
========================================================= */

function createTweetCard(

) {

  const card =
    document.createElement(
      "div"
    );


  card.className =

  card.dataset.tweetId =
    tweet.tweet_id.trim();


  /*
   * Account
   */

  const account =

      "div"
    );

  account.className =

  account.textContent =
    tweet.acc_name ||

  /*
   * Message
   */

  const message =

      "div"
    );

  message.className =
    "message-box";

  message.textContent =
    "กำลังโหลดข้อความ...";


  /*
   * Random
   */

  const randomButton =
    document.createElement(
      "button"
    );

  randomButton.className =
    "random-btn";

  randomButton.textContent =
    "🎲 สุ่มข้อความ";


  /*
   * Use
   */

  const useButton =
    document.createElement(
      "button"
    );

  useButton.className =
    "use-btn";

  useButton.textContent =
    "ใช้ข้อความนี้";

  useButton.disabled =
    true;


  /*
   * Reply
   */

  const replyButton =
    document.createElement(
      "a"
    );

  replyButton.className =
    "reply-btn disabled";

  replyButton.textContent =
    "Reply";

  replyButton.target =
    "_blank";

  replyButton.rel =
    "noopener noreferrer";


  /*
   * Remaining
   */

  const remaining =
    document.createElement(
      "div"
    );

  remaining.className =
    "remaining";

  remaining.textContent =
    "message ที่เหลือ -/-";


  /*
   * Tweet ID
   */

  const tweetId =
    document.createElement(
      "div"
    );

  tweetId.className =
    "tweet-id";

  tweetId.textContent =
    maskTweetId(
      tweet.tweet_id.trim()
    );


  /*
   * Status
   */

  const status =
    document.createElement(
      "div"
    );

  status.className =
    "status";


  /*
   * ประกอบ Card
   */

  card.appendChild(
    account
  );

  card.appendChild(
    message
  );

  card.appendChild(
    randomButton
  );

  card.appendChild(
    useButton
  );

  card.appendChild(
    replyButton
  );

  card.appendChild(
    remaining
  );

  card.appendChild(
    tweetId
  );

  card.appendChild(
    status
  );


  /*
   * เก็บ element reference
   */

  card._ui = {

    account,
    message,
    randomButton,
    useButton,
    replyButton,
    remaining,
    tweetId,
    status

  };


  /*
   * -----------------------------------------
   * Random click
   * -----------------------------------------
   */

  randomButton.addEventListener(
    "click",
    async () => {

      await randomMessage(
        card,
        tweet.tweet_id.trim()
      );

    }
  );


  /*
   * -----------------------------------------
   * Use click
   * -----------------------------------------
   */

  useButton.addEventListener(
    "click",
    async () => {

      await useCurrentMessage(
        card,
        tweet.tweet_id.trim()
      );

    }
  );


  return card;

}



/* =========================================================
   LOAD TWEET DATA
========================================================= */

async function loadTweetDataForCard(
  card,
  tweetId
) {

  try {

    /*
     * โหลด message sheet
     */

    const data =
      await loadMessageSheet(
        tweetId
      );


    /*
     * โหลด used
     */

    const usedIds =
      await getUsedMessageIds(
        tweetId
      );


    /*
     * update count
     */

    updateRemaining(
      card,
      data,
      usedIds
    );


    /*
     * ถ้ามีข้อความ
     */

    if (
      data.messages.length
    ) {

      card._ui.message.textContent =
        "กด 🎲 สุ่มข้อความ";

    }

  }

  catch (error) {

    console.error(error);

    card._ui.message.textContent =
      "โหลดข้อความไม่สำเร็จ";

    card._ui.randomButton.disabled =
      true;

    card._ui.status.textContent =
      error.message;

  }

}



/* =========================================================
   LOAD MESSAGE SHEET
========================================================= */

async function loadMessageSheet(
  tweetId
) {

  /*
   * ใช้ cache
   */

  if (
    messageCache.has(
      tweetId
    )
  ) {

    return messageCache.get(
      tweetId
    );

  }


  /*
   * Sheet name = tweet ID
   */

  const sheetName =
    encodeURIComponent(
      tweetId
    );


  /*
   * Google Visualization
   */

  const url =
    `https://docs.google.com/spreadsheets/d/` +
    `${SPREADSHEET_ID}` +
    `/gviz/tq?tqx=out:csv` +
    `&sheet=${sheetName}` +
    `&t=${Date.now()}`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `โหลด Sheet ${tweetId} ไม่สำเร็จ`
    );

  }


  const csv =
    await response.text();


  const parsed =
    parseMessageSheet(
      csv,
      tweetId
    );


  messageCache.set(
    tweetId,
    parsed
  );


  return parsed;

}



/* =========================================================
   PARSE MESSAGE SHEET
========================================================= */

function parseMessageSheet(
  csv,
  expectedTweetId
) {

  const rows =
    parseCSV(csv);


  if (
    !rows.length
  ) {

    throw new Error(
      `Sheet ${expectedTweetId} ไม่มีข้อมูล`
    );

  }


  /*
   * -----------------------------------------
   * หา All_message
   *
   * A1 = All_message
   * B1 = 5
   * -----------------------------------------
   */

  let totalCount =
    null;


  for (
    const row
    of rows
  ) {

    if (
      String(row[0]).trim()
      ===
      "All_message"
    ) {

      const value =
        Number(
          String(
            row[1] || ""
          ).trim()
        );


      if (
        Number.isFinite(
          value
        )
      ) {

        totalCount =
          value;

      }

      break;

    }

  }


  /*
   * -----------------------------------------
   * หา header
   *
   * message_id | tweet_id | text | status
   * -----------------------------------------
   */

  let headerIndex =
    -1;


  let headers = [];


  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    const normalized =
      rows[i].map(
        value =>
          String(value)
            .replace(
              /^\uFEFF/,
              ""
            )
            .trim()
      );


    if (
      normalized.includes(
        "message_id"
      ) &&
      normalized.includes(
        "tweet_id"
      ) &&
      normalized.includes(
        "text"
      )
    ) {

      headerIndex =
        i;

      headers =
        normalized;

      break;

    }

  }


  if (
    headerIndex === -1
  ) {

    throw new Error(
      `ไม่พบ header message_id / tweet_id / text ใน Sheet ${expectedTweetId}`
    );

  }


  /*
   * -----------------------------------------
   * column index
   * -----------------------------------------
   */

  const messageIdIndex =
    headers.indexOf(
      "message_id"
    );


  const tweetIdIndex =
    headers.indexOf(
      "tweet_id"
    );


  const textIndex =
    headers.indexOf(
      "text"
    );


  /*
   * -----------------------------------------
   * data rows
   * -----------------------------------------
   */

  const messages = [];


  for (
    let i = headerIndex + 1;
    i < rows.length;
    i++
  ) {

    const row =
      rows[i];


    const messageId =
      String(
        row[messageIdIndex]
        || ""
      ).trim();


    const tweetId =
      String(
        row[tweetIdIndex]
        || ""
      ).trim();


    const rawText =
      String(
        row[textIndex]
        || ""
      );


    const text =
      normalizeText(
        rawText
      );


    /*
     * ข้าม row ว่าง
     */

    if (
      !messageId ||
      !tweetId ||
      !text
    ) {

      continue;

    }


    /*
     * ตรวจ Tweet ID
     */

    if (
      tweetId !==
      expectedTweetId
    ) {

      throw new Error(
        `พบ tweet_id ${tweetId} ไม่ตรงกับ Sheet ${expectedTweetId}`
      );

    }


    messages.push({

      message_id:
        messageId,

      tweet_id:
        tweetId,

      text:
        text

    });

  }


  /*
   * ถ้า B1 ไม่มีค่า
   * ใช้จำนวนข้อมูลจริง
   */

  if (
    totalCount === null
  ) {

    totalCount =
      messages.length;

  }


  const result = {

    totalCount:
      totalCount,

    messages:
      messages

  };


  return result;

}



/* =========================================================
   RANDOM MESSAGE
========================================================= */

async function randomMessage(
  card,
  tweetId
) {

  const ui =
    card._ui;


  ui.randomButton.disabled =
    true;


  ui.randomButton.textContent =
    "กำลังสุ่ม...";


  ui.useButton.disabled =
    true;


  ui.replyButton.classList.add(
    "disabled"
  );


  ui.status.textContent =
    "";


  try {

    /*
     * โหลด message
     */

    const data =
      await loadMessageSheet(
        tweetId
      );


    /*
     * โหลดรายการใช้แล้ว
     */

    const usedIds =
      await getUsedMessageIds(
        tweetId
      );


    /*
     * filter เหลือ
     */

    const available =
      data.messages.filter(
        message =>
          !usedIds.has(
            String(
              message.message_id
            )
          )
      );


    /*
     * Update counter
     */

    updateRemaining(
      card,
      data,
      usedIds
    );


    /*
     * หมดแล้ว
     */

    if (
      !available.length
    ) {

      ui.message.textContent =
        "ข้อความถูกใช้หมดแล้ว";

      ui.status.textContent =
        "ไม่มีข้อความเหลือให้สุ่ม";

      return;

    }


    /*
     * Random
     */

    const index =
      Math.floor(
        Math.random() *
        available.length
      );


    const selected =
      available[index];


    /*
     * เก็บ selected message
     */

    card._selectedMessage =
      selected;


    /*
     * แสดงข้อความ
     */

    ui.message.textContent =
      selected.text;


    /*
     * X Reply URL
     *
     * ใช้ in_reply_to
     */

    const replyUrl =
      createReplyUrl(
        tweetId,
        selected.text
      );


    ui.replyButton.href =
      replyUrl;


    /*
     * เปิดปุ่ม
     */

    ui.replyButton.classList.remove(
      "disabled"
    );


    ui.useButton.disabled =
      false;


    ui.status.textContent =
      "ข้อความนี้ยังไม่ได้บันทึกว่าใช้แล้ว";


  }

  catch (error) {

    console.error(error);

    ui.message.textContent =
      "สุ่มข้อความไม่สำเร็จ";

    ui.status.textContent =
      error.message;

  }

  finally {

    ui.randomButton.disabled =
      false;

    ui.randomButton.textContent =
      "🎲 สุ่มข้อความ";

  }

}



/* =========================================================
   USE CURRENT MESSAGE
========================================================= */

async function useCurrentMessage(
  card,
  tweetId
) {

  const ui =
    card._ui;


  const selected =
    card._selectedMessage;


  if (
    !selected
  ) {

    ui.status.textContent =
      "กรุณาสุ่มข้อความก่อน";

    return;

  }


  ui.useButton.disabled =
    true;


  ui.randomButton.disabled =
    true;


  ui.status.textContent =
    "กำลังบันทึก...";


  try {

    /*
     * Atomic claim
     */

    const claimed =
      await claimMessage(
        tweetId,
        selected.message_id
      );


    /*
     * มีคนอื่นใช้ไปก่อนแล้ว
     */

    if (!claimed) {

      ui.status.textContent =
        "ข้อความนี้ถูกคนอื่นใช้ไปแล้ว กรุณาสุ่มใหม่";


      card._selectedMessage =
        null;


      ui.useButton.disabled =
        true;


      ui.replyButton.classList.add(
        "disabled"
      );


      /*
       * refresh counter
       */

      await refreshCardCounter(
        card,
        tweetId
      );


      return;

    }


    /*
     * สำเร็จ
     */

    ui.status.textContent =
      "✓ ใช้ข้อความนี้แล้ว";


    ui.useButton.textContent =
      "✓ ใช้แล้ว";


    /*
     * ล้าง selected
     */

    card._selectedMessage =
      null;


    /*
     * Refresh counter
     */

    await refreshCardCounter(
      card,
      tweetId
    );


  }

  catch (error) {

    console.error(error);

    ui.status.textContent =
      "บันทึกไม่สำเร็จ: " +
      error.message;


    ui.useButton.disabled =
      false;

  }

  finally {

    ui.randomButton.disabled =
      false;

  }

}



/* =========================================================
   CLAIM MESSAGE
========================================================= */

async function claimMessage(
  tweetId,
  messageId
) {

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/claim_message`,
      {

        method:
          "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            p_tweet_id:
              String(
                tweetId
              ),

            p_message_id:
              String(
                messageId
              )

          })

      }
    );


  if (
    !response.ok
  ) {

    const text =
      await response.text();


    throw new Error(
      `Supabase claim error: ${text}`
    );

  }


  const result =
    await response.json();


  return result === true;

}



/* =========================================================
   GET USED MESSAGE IDS
========================================================= */

async function getUsedMessageIds(
  tweetId
) {

  const url =
    `${SUPABASE_URL}/rest/v1/used_messages` +
    `?select=message_id` +
    `&tweet_id=eq.${encodeURIComponent(
      tweetId
    )}`;


  const response =
    await fetch(
      url,
      {

        method:
          "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`

        }

      }
    );


  if (
    !response.ok
  ) {

    const text =
      await response.text();


    throw new Error(
      `Supabase read error: ${text}`
    );

  }


  const data =
    await response.json();


  return new Set(
    data.map(
      row =>
        String(
          row.message_id
        )
    )
  );

}



/* =========================================================
   REFRESH COUNTER
========================================================= */

async function refreshCardCounter(
  card,
  tweetId
) {

  const data =
    await loadMessageSheet(
      tweetId
    );


  const usedIds =
    await getUsedMessageIds(
      tweetId
    );


  updateRemaining(
    card,
    data,
    usedIds
  );

}



/* =========================================================
   UPDATE REMAINING
========================================================= */

function updateRemaining(
  card,
  data,
  usedIds
) {

  const availableCount =
    data.messages.filter(
      message =>
        !usedIds.has(
          String(
            message.message_id
          )
        )
    ).length;


  card._ui.remaining.textContent =
    `message ที่เหลือ ${availableCount}/${data.totalCount}`;

}



/* =========================================================
   CREATE X REPLY URL
========================================================= */

function createReplyUrl(
  tweetId,
  text
) {

  return (
    "https://twitter.com/intent/tweet" +
    "?in_reply_to=" +
    encodeURIComponent(
      tweetId
    ) +
    "&text=" +
    encodeURIComponent(
      text
    )
  );

}



/* =========================================================
   MASK TWEET ID
========================================================= */

function maskTweetId(
  tweetId
) {

  const id =
    String(
      tweetId
    );


  if (
    id.length <= 4
  ) {

    return `TW: ••••••••${id}`;

  }


  return (
    "TW: ••••••••" +
    id.slice(-4)
  );

}



/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(
  text
) {

  return String(text)

    .replace(
      /<br\s*\/?>/gi,
      "\n"
    )

    .trim();

}



/* =========================================================
   CACHE BUSTER
========================================================= */

function addCacheBuster(
  url
) {

  const separator =
    url.includes("?")
      ? "&"
      : "?";


  return (
    url +
    separator +
    "t=" +
    Date.now()
  );

}



/* =========================================================
   CSV → OBJECTS
========================================================= */

function csvToObjects(
  csv
) {

  const rows =
    parseCSV(csv);


  if (
    !rows.length
  ) {

    return [];

  }


  const headers =
    rows[0].map(
      header =>
        String(
          header
        )
          .replace(
            /^\uFEFF/,
            ""
          )
          .trim()
    );


  return rows
    .slice(1)
    .filter(
      row =>
        row.some(
          value =>
            String(
              value
            ).trim() !== ""
        )
    )
    .map(
      row => {

        const object = {};


        headers.forEach(
          (
            header,
            index
          ) => {

            object[header] =
              row[index] ||
              "";

          }
        );


        return object;

      }
    );

}



/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(
  csv
) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes =
    false;


  for (
    let i = 0;
    i < csv.length;
    i++
  ) {

    const char =
      csv[i];


    const next =
      csv[i + 1];


    /*
     * escaped quote
     */

    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      value += '"';

      i++;

      continue;

    }


    /*
     * quote
     */

    if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

      continue;

    }


    /*
     * comma
     */

    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(
        value
      );

      value = "";

      continue;

    }


    /*
     * newline
     */

    if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(
        value
      );

      rows.push(
        row
      );


      row = [];

      value = "";

      continue;

    }


    value +=
      char;

  }


  /*
   * final row
   */

  if (
    value !== "" ||
    row.length
  ) {

    row.push(
      value
    );


    rows.push(
      row
    );

  }


  return rows;

}



/* =========================================================
   ERROR
========================================================= */

function showError(
  message
) {

  errorBox.textContent =
    message;

  errorBox.style.display =
